<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AI Usage Tracker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>AI Usage Tracker</h1>
      <button id="refresh" type="button" title="Refresh">↻</button>
    </header>
    <main id="providers"></main>
    <template id="provider-template">
      <section class="provider">
        <h2></h2>
        <div class="accounts"></div>
        <p class="message"></p>
        <button class="action" type="button"></button>
      </section>
    </template>
    <template id="account-template">
      <article class="account">
        <div class="account-head">
          <span class="account-name"></span>
          <span class="account-type"></span>
        </div>
        <ul class="limits"></ul>
        <p class="spend"></p>
        <p class="message"></p>
      </article>
    </template>
    <template id="limit-template">
      <li class="limit">
        <div class="limit-head">
          <span class="limit-label"></span>
          <span class="limit-value"></span>
        </div>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="limit-foot">
          <span class="limit-detail"></span>
          <span class="limit-reset"></span>
        </div>
      </li>
    </template>
    <script src="popup.js" type="module"></script>
  </body>
</html>
